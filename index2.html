<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Navbar with Search</title>
  <style>
    body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background-color: #0b0d25;
  color: #fff;
}

.navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 60px;
  background-color: #0b0d25;
}

.nav-links {
  list-style: none;
  display: flex;
  gap: 30px;
  margin: 0;
  padding: 0;
}

.nav-links a {
  text-decoration: none;
  color: #fff;
  font-weight: 500;
  transition: color 0.3s ease;
}

.nav-links a.active {
  color: #00bfff; /* Cyan for active */
}

.nav-links a:hover {
  color: #00bfff;
}

.search-box {
  display: flex;
  align-items: center;
  background-color: #0b0d25;
  border: 1px solid #2e2e4d;
  border-radius: 30px;
  padding: 5px 15px;
}

.search-box input {
  background: transparent;
  border: none;
  color: #fff;
  outline: none;
  font-size: 16px;
  padding: 8px;
}

.search-box button {
  background: transparent;
  border: none;
  color: #fff;
  cursor: pointer;
  font-size: 16px;
}



  </style>
</head>
<body>
    <main>
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="#" class="active">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Projects</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Blog</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
    <div class="search-box">
      <input type="text" placeholder="Search" />
      <button><i class="fas fa-search"></i></button>
    </div>
    </nav>
  </main>
</body>
</html>
